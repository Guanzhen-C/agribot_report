<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-labelledby="title description" xml:lang="zh-CN">
  <title id="title">三类控制器硬件在环综合架构</title>
  <desc id="description">仿真电脑通过网口 ROS 2 向 RDK X5 发送传感器数据和仿真时钟，采摘工况的机械臂命令和反馈也使用该网口。两端的 USB-CAN 分别接 HPM6750 的 CAN1 和 CAN0，传递底盘及机具命令和反馈。仿真电脑独立记录定位、轨迹、报文与作业事件。</desc>
  <defs>
    <marker id="ros-tip" markerWidth="9" markerHeight="10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0L9 5L0 10Z" fill="#24669c"/>
    </marker>
    <marker id="can-tip" markerWidth="8" markerHeight="9" refX="8" refY="4.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0L8 4.5L0 9Z" fill="#9e5223"/>
    </marker>
    <marker id="record-tip" markerWidth="9" markerHeight="10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L9 5L0 10Z" fill="#667784"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1279" height="689" rx="8" fill="#f8fafb" stroke="#d0d7de"/>

  <!-- Computing, simulation, and firmware groups. -->
  <rect x="24" y="24" width="320" height="506" rx="8" fill="#edf3f9" stroke="#bacada"/>
  <path d="M32 24H336Q344 24 344 32V82H24V32Q24 24 32 24Z" fill="#254969"/>
  <rect x="936" y="24" width="320" height="506" rx="8" fill="#eef5f2" stroke="#b8cdc5"/>
  <path d="M944 24H1248Q1256 24 1256 32V82H936V32Q936 24 944 24Z" fill="#265c52"/>
  <rect x="480" y="205" width="320" height="252" rx="8" fill="#fff" stroke="#cfac89"/>
  <path d="M488 205H792Q800 205 800 213V253H480V213Q480 205 488 205Z" fill="#f6eadc"/>

  <!-- Separate ROS topics, physical CAN, and passive recording paths. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#24669c" stroke-width="3" marker-end="url(#ros-tip)">
      <path d="M950 156H330"/>
      <path d="M330 485H950" marker-start="url(#ros-tip)"/>
    </g>
    <g stroke="#9e5223" stroke-width="2.7" marker-start="url(#can-tip)" marker-end="url(#can-tip)">
      <path d="M330 308H346"/>
      <path d="M456 308H490"/>
      <path d="M612 308H668"/>
      <path d="M790 308H824"/>
      <path d="M934 308H950"/>
    </g>
    <g stroke="#9e5223" stroke-width="2.7" marker-end="url(#can-tip)">
      <path d="M340 308V419H330"/>
      <path d="M940 308V419H950"/>
    </g>
    <path d="M184 224V242" stroke="#667784" stroke-width="2.3" marker-end="url(#record-tip)"/>
    <g stroke="#667784" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#record-tip)">
      <path d="M184 536V618H262"/>
      <path d="M1096 536V618H1018"/>
    </g>
  </g>

  <g fill="#fff" stroke="#bdcad5">
    <rect x="44" y="103" width="280" height="116" rx="7"/>
    <rect x="44" y="247" width="280" height="116" rx="7"/>
    <rect x="44" y="391" width="280" height="122" rx="7"/>
  </g>
  <g fill="#fff" stroke="#bdcec7">
    <rect x="956" y="103" width="280" height="116" rx="7"/>
    <rect x="956" y="247" width="280" height="116" rx="7"/>
    <rect x="956" y="391" width="280" height="122" rx="7"/>
  </g>
  <g fill="#fff9f1" stroke="#cda17a">
    <rect x="352" y="277" width="98" height="62" rx="7"/>
    <rect x="496" y="274" width="110" height="69" rx="7"/>
    <rect x="674" y="274" width="110" height="69" rx="7"/>
    <rect x="830" y="277" width="98" height="62" rx="7"/>
  </g>
  <path d="M496 427H784" stroke="#e1d2c3"/>
  <rect x="268" y="571" width="744" height="94" rx="8" fill="#fff" stroke="#b7c5cf"/>

  <g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
    <g fill="#fff" font-weight="700" font-size="28">
      <text x="44" y="64">RDK X5</text>
      <text x="956" y="64">仿真电脑</text>
    </g>
    <g fill="#fff" font-size="16" text-anchor="end">
      <text x="324" y="63">导航与控制</text>
      <text x="1236" y="63">Unity / Gazebo / RViz</text>
    </g>
    <text x="501" y="239" fill="#613d23" font-size="27" font-weight="700">HPM6750</text>
    <text x="779" y="238" fill="#613d23" font-size="18" font-weight="600" text-anchor="end">工况固件</text>

    <g fill="#203141" font-size="23" font-weight="700">
      <text x="62" y="140">自动驾驶导航控制器</text>
      <text x="62" y="283">整机任务</text>
      <text x="62" y="428">智能机具控制器</text>
      <text x="974" y="140">仿真传感器</text>
      <text x="974" y="283">仿真底盘</text>
      <text x="974" y="428">仿真机具</text>
    </g>
    <g fill="#344756" font-size="18">
      <text x="62" y="174" font-size="17">FAST-LIVO2+RTK / NavSat ESKF</text>
      <text x="62" y="199">Smac Hybrid-A* / MPPI</text>
      <text x="62" y="316">车速与转向指令</text>
      <text x="62" y="341">悬挂 / 动力换挡 / CVT 目标</text>
      <text x="62" y="461">MoveIt 2 / AgIsoStack++</text>
      <text x="62" y="487">采摘 / 喷水 / 碎枝</text>
      <text x="974" y="174">点云 / 图像 / IMU / GNSS</text>
      <text x="974" y="199">仿真时钟</text>
      <text x="974" y="316">Car0 阿克曼 / Car3 差速履带</text>
      <text x="974" y="341">Car4 轮式拖拉机</text>
      <text x="974" y="461">Lite6 机械臂 / 植保机 / 碎枝机</text>
      <text x="974" y="487">三点悬挂 / 圆盘耙</text>
    </g>

    <g text-anchor="middle">
      <g fill="#743e1c" font-size="18" font-weight="700">
        <text x="401" y="303">X5</text>
        <text x="879" y="303">PC</text>
        <text x="551" y="302">CAN1</text>
        <text x="729" y="302">CAN0</text>
        <text x="454" y="267">CAN</text>
        <text x="826" y="267">CAN</text>
      </g>
      <g fill="#743e1c" font-size="16">
        <text x="401" y="326">USB-CAN</text>
        <text x="879" y="326">USB-CAN</text>
        <text x="551" y="326">算力侧</text>
        <text x="729" y="326">执行侧</text>
      </g>
      <g fill="#344756" font-size="17">
        <text x="640" y="369">采摘：底盘原生 CAN 桥接</text>
        <text x="640" y="393">植保与碎枝：ISOBUS 转换农具报文</text>
        <text x="640" y="417">拖拉机：悬挂闭环与动力反馈</text>
        <text x="640" y="449" font-size="15">Car0 1 Mbit/s  ·  Car3/Car4 250 kbit/s</text>
      </g>
      <g fill="#205b90" font-size="20" font-weight="700">
        <text x="640" y="138">网口 ROS 2：仿真传感器与时钟</text>
        <text x="640" y="514">网口 ROS 2：机械臂控制与反馈（采摘）</text>
      </g>
    </g>

    <text x="293" y="606" fill="#203141" font-size="24" font-weight="700">独立记录与评估</text>
    <text x="987" y="606" fill="#495f70" font-size="17" text-anchor="end">仿真电脑</text>
    <text x="293" y="641" fill="#344756" font-size="19">轨迹与定位、CAN 报文、机具状态、作业事件与测试结果</text>
  </g>
</svg>
