    robot_description_kinematics:
      arm:
        kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
        kinematics_solver_timeout: 0.1
        position_only_ik: false
    robot_description_planning:
      joint_limits:
        manipulator_joint1:
          has_velocity_limits: true
          max_velocity: 0.9
          has_acceleration_limits: true
          max_acceleration: 1.5
        manipulator_joint2:
          has_velocity_limits: true
          max_velocity: 0.9
          has_acceleration_limits: true
          max_acceleration: 1.5
        manipulator_joint3:
          has_velocity_limits: true
          max_velocity: 0.9
          has_acceleration_limits: true
          max_acceleration: 1.5
        manipulator_joint4:
          has_velocity_limits: true
          max_velocity: 0.9
          has_acceleration_limits: true
          max_acceleration: 1.5
        manipulator_joint5:
          has_velocity_limits: true
          max_velocity: 0.9
          has_acceleration_limits: true
          max_acceleration: 1.5
        manipulator_joint6:
          has_velocity_limits: true
          max_velocity: 0.9
          has_acceleration_limits: true
          max_acceleration: 1.5
    planning_pipelines:
    - ompl
    default_planning_pipeline: ompl
    ompl:
      planning_plugin: ompl_interface/OMPLPlanner
      request_adapters: default_planner_request_adapters/AddTimeOptimalParameterization
        default_planner_request_adapters/FixWorkspaceBounds default_planner_request_adapters/FixStartStateBounds
        default_planner_request_adapters/FixStartStateCollision default_planner_request_adapters/FixStartStatePathConstraints
      start_state_max_bounds_error: 0.1
      planner_configs:
        RRTConnectkConfigDefault:
          type: geometric::RRTConnect
          range: 0.15
      arm:
        planner_configs:
        - RRTConnectkConfigDefault
        longest_valid_segment_fraction: 0.001
    allow_trajectory_execution: false
    moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
    moveit_simple_controller_manager:
      controller_names:
      - hil_arm_controller
      hil_arm_controller:
        type: FollowJointTrajectory
        action_ns: follow_joint_trajectory
        default: true
        joints:
        - manipulator_joint1
        - manipulator_joint2
        - manipulator_joint3
        - manipulator_joint4
        - manipulator_joint5
        - manipulator_joint6
    publish_robot_description_semantic: true
    planning_scene_monitor_options:
      joint_state_topic: /joint_states
